[package]
name = "watercolor-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "_watercolor_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
